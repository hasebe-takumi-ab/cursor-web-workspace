-->

#delispa-yt-gallery .yt-embed-wrap > iframe {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    border: 0 !important;
}

#delispa-yt-gallery .yt-channel-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 22px rgba(0,0,0,0.35) !important;
}
#delispa-yt-gallery .yt-channel-btn:active { transform: translateY(0); }

@media (min-width: 768px) {
    #delispa-yt-gallery .yt-header { padding: 50px 20px !important; }
    #delispa-yt-gallery .yt-h1 { font-size: 2.6rem !important; letter-spacing: 4px !important; }
    #delispa-yt-gallery .yt-h1-sub { font-size: 1.05rem !important; letter-spacing: 3px !important; }
    #delispa-yt-gallery .yt-channel-card { padding: 38px 40px !important; }
    /* PCではリリース・スペシャルは2カラム */
    #delispa-yt-gallery .yt-section[data-cat="release"] .yt-grid,

</style>

<script>
(function() {
    var root = document.getElementById('delispa-yt-gallery');
    if (!root) return;

    /* ===== タブ切り替え ===== */
    var tabs = root.querySelectorAll('.yt-tab');
    tabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
            tabs.forEach(function(t) { t.classList.remove('yt-tab-active'); });
            tab.classList.add('yt-tab-active');
            var filter = tab.getAttribute('data-filter');
            root.classList.remove('yt-filter-release','yt-filter-special','yt-filter-monthly','yt-filter-mv');
            if (filter !== 'all') root.classList.add('yt-filter-' + filter);
        });
    });

    /* ===== プレースホルダーに iframe を直接挿入 =====
       初期HTMLにiframeを置くとWordPress/Cocoonが自動ラッパーをかける問題があるため、
       JSで動的に挿入する。YouTubeプレーヤー自体がサムネ＋▶を表示するので、
       ユーザーは1タップで音付き再生できる（iOSでも確実に動作） */
    var wraps = root.querySelectorAll('.yt-embed-wrap[data-yt-video-id]');
    wraps.forEach(function(wrapper) {
        var videoId = wrapper.getAttribute('data-yt-video-id');
        if (!videoId) return;
        var listId = wrapper.getAttribute('data-yt-list') || null;
        var origTitle = wrapper.getAttribute('data-yt-title') || 'YouTube video';

        wrapper.innerHTML = '';

        var src = 'https://www.youtube.com/embed/' + videoId + '?rel=0&playsinline=1';
        if (listId) src += '&list=' + listId;

        var iframe = document.createElement('iframe');
        iframe.src = src;
        iframe.title = origTitle;
        iframe.loading = 'lazy';
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
        iframe.setAttribute('allowfullscreen', '');
        iframe.setAttribute('playsinline', '');
        iframe.setAttribute('webkit-playsinline', '');
        iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
        iframe.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;';

        wrapper.appendChild(iframe);
    });
})();
</script>
